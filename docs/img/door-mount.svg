<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
  <title>Side section: the door screwed to printed brackets on the pull-out's front plate</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#d9541e" stroke-width="1.6"/></marker></defs>
  <rect width="720" height="340" fill="#fbfaf6"/>
  <text x="30" y="28" fill="#6c675c">side view, closed (front is on the left)</text>
  <!-- door -->
  <rect x="90" y="40" width="30" height="270" fill="#c8a676" stroke="#8a6d48"/>
  <text x="105" y="180" fill="#5b4527" transform="rotate(-90 105 180)" text-anchor="middle">your door</text>
  <!-- face frame rails -->
  <rect x="124" y="40" width="36" height="40" fill="#e6d3b3" stroke="#8a6d48"/>
  <rect x="124" y="262" width="36" height="48" fill="#e6d3b3" stroke="#8a6d48"/>
  <text x="142" y="64" text-anchor="middle" fill="#5b4527" font-size="11">frame</text>
  <!-- front plate -->
  <rect x="160" y="96" width="14" height="196" fill="#2f6d9c" stroke="#163650"/>
  <!-- brackets -->
  <rect x="120" y="120" width="40" height="44" fill="#4f8dbf" stroke="#163650"/>
  <rect x="120" y="214" width="40" height="44" fill="#4f8dbf" stroke="#163650"/>
  <!-- screws -->
  <line x1="150" y1="142" x2="104" y2="142" stroke="#1f1e1b" stroke-width="3"/>
  <line x1="186" y1="128" x2="138" y2="128" stroke="#5f6368" stroke-width="3"/>
  <circle cx="188" cy="128" r="4" fill="#5f6368"/>
  <!-- carriage -->
  <rect x="174" y="282" width="210" height="10" fill="#2f6d9c" stroke="#163650"/>
  <rect x="300" y="100" width="8" height="182" fill="#d6d2c8" stroke="#9a9488"/>
  <!-- bracket depth dim -->
  <line x1="120" y1="186" x2="160" y2="186" stroke="#d9541e" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
  <g fill="#1f1e1b">
    <line x1="160" y1="142" x2="400" y2="70" stroke="#a9a397"/>
    <text x="406" y="66" font-weight="600">Door bracket (printed, 4 per door)</text>
    <text x="406" y="83" fill="#6c675c">screwed to the door from behind, then to the</text>
    <text x="406" y="99" fill="#6c675c">front plate from inside the pull-out</text>
    <line x1="140" y1="196" x2="400" y2="150" stroke="#a9a397"/>
    <text x="406" y="146" font-weight="600" fill="#d9541e">Bracket depth = face frame + front gap + 2 mm</text>
    <text x="406" y="163" fill="#6c675c">the generator sizes it for you</text>
    <line x1="186" y1="128" x2="400" y2="210" stroke="#a9a397"/>
    <text x="406" y="206" font-weight="600">Slotted holes</text>
    <text x="406" y="223" fill="#6c675c">±4 mm up and down, ±3 mm side to side,</text>
    <text x="406" y="239" fill="#6c675c">so the door's gaps can be lined up</text>
    <line x1="174" y1="200" x2="400" y2="262" stroke="#a9a397"/>
    <text x="406" y="266" font-weight="600">Front plate</text>
    <text x="406" y="283" fill="#6c675c">an open frame here: the door is the face</text>
  </g>
</svg>
