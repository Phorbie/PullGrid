<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
  <title>Side section of a cabinet: depth, face frame depth and door thickness</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#d9541e" stroke-width="1.6"/></marker></defs>
  <rect width="720" height="360" fill="#fbfaf6"/>
  <text x="690" y="24" fill="#6c675c" text-anchor="end">side view, cut through the middle (front is on the left)</text>
  <!-- floor, back, top -->
  <rect x="120" y="270" width="460" height="14" fill="#e6d3b3" stroke="#8a6d48"/>
  <rect x="580" y="60" width="14" height="224" fill="#e6d3b3" stroke="#8a6d48"/>
  <rect x="120" y="60" width="474" height="12" fill="#e6d3b3" stroke="#8a6d48"/>
  <!-- face frame rails -->
  <rect x="96" y="60" width="24" height="34" fill="#d9c09a" stroke="#8a6d48"/>
  <rect x="96" y="244" width="24" height="40" fill="#d9c09a" stroke="#8a6d48"/>
  <!-- door -->
  <rect x="66" y="52" width="26" height="240" fill="#c8a676" stroke="#8a6d48" opacity="0.9"/>
  <text x="79" y="178" fill="#5b4527" transform="rotate(-90 79 178)" text-anchor="middle">door</text>
  <!-- C -->
  <line x1="122" y1="230" x2="578" y2="230" stroke="#d9541e" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="350" y="222" text-anchor="middle" fill="#d9541e" font-weight="600">C · interior depth: back of the face frame to the back wall</text>
  <!-- face frame depth -->
  <line x1="96" y1="310" x2="120" y2="310" stroke="#1f1e1b" stroke-width="1.2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="96" y1="286" x2="96" y2="316" stroke="#a9a397"/><line x1="120" y1="286" x2="120" y2="316" stroke="#a9a397"/>
  <text x="108" y="332" text-anchor="middle" fill="#1f1e1b" font-weight="600">face frame depth</text>
  <text x="108" y="348" text-anchor="middle" fill="#6c675c">usually 3/4″ (19 mm)</text>
  <!-- door thickness -->
  <line x1="66" y1="40" x2="92" y2="40" stroke="#1f1e1b" stroke-width="1.2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="40" y="20" fill="#1f1e1b" font-weight="600">door thickness</text>
  <!-- bottom rail height -->
  <line x1="140" y1="244" x2="140" y2="270" stroke="#1f1e1b" stroke-width="1.2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="120" y1="244" x2="146" y2="244" stroke="#a9a397" stroke-dasharray="3 3"/>
  <text x="152" y="262" fill="#1f1e1b">bottom rail height (above the floor)</text>
  <text x="380" y="140" fill="#6c675c" text-anchor="middle">Measure C at the floor: pipes and back panels</text>
  <text x="380" y="157" fill="#6c675c" text-anchor="middle">are often closer down there.</text>
</svg>
