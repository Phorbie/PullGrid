name: Test & deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq openscad
      - run: tests/run.sh
      - run: tests/interference.sh
      - name: interference, stacked tiers (upper tier, printed rails)
        run: tests/interference.sh -D 'opening_h=1200' -D 'shelves=[400,800]' -D 'test_tier=1' -D 'rail_type="printed"'
      - name: interference, one-sided tier behind a 90-degree door
        run: tests/interference.sh -D 'door_mode="keep"' -D 'door_opens="only_90"'
      - name: interference, side-by-side pull-outs, one-sided beside a 90-degree door
        run: tests/interference.sh -D 'opening_w=480' -D 'door_mode="keep"' -D 'door_opens="only_90"' -D 'test_pullout=2'
      - name: interference, mounted pair facing outward
        run: tests/interference.sh -D 'opening_w=480' -D 'test_pullout=2'
      - name: interference, hung door closing over printed bar handles
        run: tests/interference.sh -D 'door_mode="keep"' -D 'handle="bar"'
      - run: tests/print_parts.sh
      - name: print parts, stacked tiers
        run: tests/print_parts.sh -D 'opening_h=900' -D 'shelves=[400]' -D 'rail_type="printed"'
      - name: print parts, no door, arch handles
        run: tests/print_parts.sh -D 'door_mode="none"' -D 'handle="arch"'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bambu Studio project, P1S (calibration corner)
        run: tests/threemf.sh p1s
      - name: Bambu Studio project, A1, 4 tiers (split into two files)
        run: tests/threemf.sh a1 -D 'opening_h=1500' -D 'opening_w=380' -D 'shelves=[400,800,1150]' -D 'rail_type="printed"'

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: bash site/build.sh _site
      - run: node tests/check_links.mjs _site
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy site from ${{ github.sha }}"
